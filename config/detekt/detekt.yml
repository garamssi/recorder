# 기본 규칙셋(buildUponDefaultConfig=true) 위에 프로젝트 관례만 보정한다.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    # 기본값이 있는 파라미터(테스트 주입용 디스패처 등)는 호출부 부담이 없다.
    ignoreDefaultParameters: true
    # 컴포저블은 상태·콜백을 파라미터로 받는 것이 관례다 (상태 호이스팅).
    ignoreAnnotated: ['Composable']
  LongMethod:
    # 선언형 UI 트리는 함수 길이 규칙과 목적이 다르다. 로직 함수에는 여전히 적용된다.
    ignoreAnnotated: ['Composable']

style:
  ReturnCount:
    # 초입의 가드 절(if (...) return ...)은 중첩을 줄이는 관례로 허용한다.
    excludeGuardClauses: true
  MagicNumber:
    ignoreAnnotated: ['Composable']
    # 이름 있는 프로퍼티에 값을 정의하는 것은 "상수로 관리"에 해당한다 (예: 디자인 토큰 Color 정의).
    # 인라인 사용은 여전히 금지된다.
    ignorePropertyDeclaration: true
    # enum 엔트리(FPS_60(60) 등)는 이름이 값을 설명하는 상수 정의다.
    ignoreEnums: true
